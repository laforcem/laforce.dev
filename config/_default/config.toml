# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

# baseURL = "https://your_domain.com/"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 0

# RSS is generated for blog posts only (see /content/posts/_index.md).
# Home needs JSON: it is the search index.
[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[pagination]
  pagerSize = 10
